name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Rollback para este commit SHA (deploy via ECR sem Terraform)"
        required: false
        type: string
      destroy:
        description: "Destroy all AWS resources"
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1

jobs:
  destroy:
    name: Destroy
    if: inputs.destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Nuke all resources
        continue-on-error: true
        working-directory: .
        run: bash scripts/cleanup.sh ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9

      - name: Terraform Init + Destroy
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="events-app-tfstate-$ACCOUNT_ID"
          terraform init -backend-config="bucket=$BUCKET"
          terraform destroy -auto-approve

  terraform:
    name: Terraform
    if: inputs.rollback_sha == '' && !inputs.destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup S3 backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="events-app-tfstate-$ACCOUNT_ID"
          aws s3api create-bucket --bucket "$BUCKET" --region $AWS_REGION 2>/dev/null || true
          echo "BUCKET=$BUCKET" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9

      - name: Terraform Init
        run: terraform init -backend-config="bucket=$BUCKET"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color
        continue-on-error: false

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -no-color

  build-and-deploy:
    name: Build & Deploy
    needs: terraform
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || inputs.rollback_sha != '') && !inputs.destroy

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build and push Docker image
        if: inputs.rollback_sha == ''
        run: |
          IMAGE_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/events-app
          docker build -t $IMAGE_URI:latest -t $IMAGE_URI:${{ github.sha }} -f backend/Dockerfile .
          docker push --all-tags $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Use rollback image
        if: inputs.rollback_sha != ''
        run: |
          IMAGE_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/events-app
          echo "Rolling back to ${{ inputs.rollback_sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "ROLLBACK_TAG=${{ inputs.rollback_sha }}" >> $GITHUB_ENV

      - name: Wait for EC2 + SSM readiness
        run: |
          # Find instance by EIP (garantia: único, evita pegar instância órfã)
          EIP=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=events-app" \
            --region $AWS_REGION \
            --query 'Addresses[0].PublicIp' --output text)
          INSTANCE_ID=$(aws ec2 describe-addresses \
            --public-ips "$EIP" \
            --region $AWS_REGION \
            --query 'Addresses[0].InstanceId' --output text)
          echo "EIP: $EIP  Instance: $INSTANCE_ID"

          echo "Waiting for instance status OK..."
          aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"

          echo "Waiting for SSM agent..."
          for i in $(seq 1 30); do
            STATUS=$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || echo "NotFound"
            )
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent online"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "SSM agent not ready after 5 min"
              exit 1
            fi
            sleep 10
          done
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSM
        run: |
          cat > /tmp/deploy.json << JSON
          {
            "commands": [
              "set -e",
              "for i in \$(seq 1 36); do test -f /opt/app/.user_data_done && break; echo \"waiting user_data... (\$i)\"; sleep 10; done",
              "test -f /opt/app/.user_data_done || { echo 'user_data not done after 6 min'; exit 1; }",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com",
              "docker pull $IMAGE_URI:${ROLLBACK_TAG:-latest}",
              "docker stop events-app 2>/dev/null || true",
              "docker rm events-app 2>/dev/null || true",
              "docker run -d --name events-app --restart unless-stopped -p 8080:8000 --env-file /opt/app/.env $IMAGE_URI:${ROLLBACK_TAG:-latest}"
            ]
          }
          JSON

          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters file:///tmp/deploy.json \
              --region $AWS_REGION \
              --output text \
              --query 'Command.CommandId'
          )
          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region $AWS_REGION \
                --query 'CommandInvocations[0].Status' \
                --output text 2>/dev/null || echo "Pending"
            )
            case "$STATUS" in
              Success)
                echo "Deploy succeeded!"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region $AWS_REGION \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                echo "Deploy failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region $AWS_REGION \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
                ;;
            esac
            echo "Waiting... ($STATUS)"
            sleep 10
          done
          echo "Timeout waiting for deploy"
          exit 1

      - name: Validate container health
        run: |
          EIP=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=events-app" \
            --region $AWS_REGION \
            --query 'Addresses[0].PublicIp' --output text)
          echo "Waiting for HTTP 200 at http://$EIP:8080/health ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$EIP:8080/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy!"
              curl -s http://$EIP:8080/health
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s"
            sleep 10
          done
          echo "API not healthy after 2 minutes"
          curl -v http://$EIP:8080/health || true
          exit 1
